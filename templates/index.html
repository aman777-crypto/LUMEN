<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME VARIABLES (ChatGPT-style palette) ── */
    :root {
      --bg:           #0d0d0d;
      --bg-sidebar:   #000000;
      --bg-surface:   #171717;
      --bg-input:     #171717;
      --bg-user-msg:  #1a1a1a;
      --bg-hover:     #1a1a1a;
      --border:       #2a2a2a;
      --border-top:   #2a2a2a;
      --text:         #ececf1;
      --text-body:    #d1d5db;
      --text-muted:   #8e8ea0;
      --text-faint:   #8e8ea0;
      --text-empty:   #5a5a5a;
      --accent:       #10a37f;
      --accent-hover: #0d8f6f;
      --accent-light: #19c37d;
      --scrollbar:    #2a2a2a;
      --code-bg:      #1a1a1a;
    }

    body.light {
      --bg:           #ffffff;
      --bg-sidebar:   #f7f7f8;
      --bg-surface:   #f7f7f8;
      --bg-input:     #ffffff;
      --bg-user-msg:  #f7f7f8;
      --bg-hover:     #ececf1;
      --border:       #e5e5e5;
      --border-top:   #e5e5e5;
      --text:         #343541;
      --text-body:    #353740;
      --text-muted:   #6e6e80;
      --text-faint:   #8e8ea0;
      --text-empty:   #c5c5d2;
      --accent:       #10a37f;
      --accent-hover: #0d8f6f;
      --accent-light: #19c37d;
      --scrollbar:    #d9d9e3;
      --code-bg:      #f7f7f8;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(-260px);
      transition: transform 0.25s ease, background 0.2s, border-color 0.2s;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header span {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .close-btn {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 18px; padding: 4px;
    }
    .close-btn:hover { color: var(--text); }

    .sidebar-section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding: 0 16px 8px;
    }

    /* history items */
    .history-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .history-item:hover { background: var(--bg-hover); }
    .history-item .q-text {
      font-size: 13px;
      color: var(--text-body);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-item .q-time {
      font-size: 11px;
      color: var(--text-faint);
      flex-shrink: 0;
    }

    /* source items */
    .source-item {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .source-item::before { content: '📄'; font-size: 11px; }

    .sidebar-empty {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-empty);
      font-style: italic;
    }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin-left: 0;
      transition: margin-left 0.25s ease;
    }
    #main.shifted { margin-left: 260px; }

    /* top bar */
    #topbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-top);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      transition: background 0.2s, border-color 0.2s;
    }
    #menu-btn {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 20px; padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    #menu-btn:hover { background: var(--bg-sidebar); color: var(--text); }

    #topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    /* theme toggle */
    #theme-btn {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 18px; padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
      margin-left: auto;
    }
    #theme-btn:hover { background: var(--bg-sidebar); color: var(--text); }
    #theme-btn { display: flex; align-items: center; justify-content: center; }

    .theme-icon {
      transition: transform 0.5s ease;
      transform: rotate(0deg);
    }
    body.light .theme-icon { transform: rotate(180deg); }

    .icon-mask-dot {
      transform: translate(4px, -4px);
      transition: transform 0.45s ease;
    }
    body.light .icon-mask-dot { transform: translate(14px, -14px); }

    .icon-rays {
      opacity: 0;
      transform: scale(0.4);
      transform-origin: 12px 12px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    body.light .icon-rays { opacity: 1; transform: scale(1); }

    /* chat area */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
      background: var(--bg);
      transition: background 0.2s;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

    .message-wrap {
      max-width: 720px;
      margin: 0 auto 24px;
      padding: 0 20px;
    }

    /* user bubble */
    .user-msg {
      background: var(--bg-user-msg);
      border-radius: 12px 12px 2px 12px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      display: inline-block;
      max-width: 80%;
      float: right;
      clear: both;
      transition: background 0.2s;
    }

    /* assistant bubble */
    .assistant-wrap { clear: both; }
    .assistant-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 6px;
    }
    .assistant-msg {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-body);
      transition: background 0.2s, border-color 0.2s;
    }
    .assistant-msg p { margin-bottom: 10px; }
    .assistant-msg p:last-child { margin-bottom: 0; }
    .assistant-msg strong { color: var(--text); }
    .assistant-msg ol, .assistant-msg ul { padding-left: 20px; margin-bottom: 10px; }
    .assistant-msg li { margin-bottom: 4px; }
    .assistant-msg code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent-light);
    }

    /* sources tag */
    .sources-line {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .source-tag {
      font-size: 11px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--accent-light);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* thinking indicator */
    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }
    .thinking span {
      width: 6px; height: 6px;
      background: var(--text-faint);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* empty state */
    #empty-state {
      max-width: 720px;
      margin: 60px auto 0;
      padding: 0 20px;
      text-align: center;
    }
    #empty-state h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-empty);
      margin-bottom: 8px;
    }
    #empty-state p {
      font-size: 14px;
      color: var(--text-empty);
    }

    /* ── BOTTOM BAR ── */
    #bottom-bar {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border-top);
      background: var(--bg);
      transition: background 0.2s, border-color 0.2s;
    }
    #input-row {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      transition: border-color 0.15s, background 0.2s;
    }
    #input-row:focus-within { border-color: var(--accent); }

    #question-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--text);
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 4px 0;
      font-family: inherit;
    }
    #question-input::placeholder { color: var(--text-empty); }

    .bar-btn {
      background: none; border: none;
      cursor: pointer; color: var(--text-faint);
      padding: 6px; border-radius: 8px;
      font-size: 18px; line-height: 1;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .bar-btn:hover { background: var(--bg-hover); color: var(--text); }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { background: var(--bg-user-msg); color: var(--text-faint); cursor: not-allowed; }

    #file-input { display: none; }

    /* upload status toast */
    #upload-toast {
      max-width: 720px;
      margin: 6px auto 0;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      min-height: 16px;
    }

    /* overlay when sidebar open on mobile */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    @media (max-width: 600px) {
      #overlay.show { display: block; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <span>Lumen</span>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">History</div>
    <div id="history-list">
      <div class="sidebar-empty">No questions yet</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">Sources</div>
    <div id="source-list">
      <div class="sidebar-empty">Ask a question to see sources</div>
    </div>
  </div>
</div>

<div id="overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div id="main">
  <!-- top bar -->
  <div id="topbar">
    <button id="menu-btn" onclick="toggleSidebar()" title="Menu">☰</button>
    <span id="topbar-title">Lumen</span>
    <button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <svg class="theme-icon" width="19" height="19" viewBox="0 0 24 24" fill="none">
        <mask id="moon-mask">
          <rect x="0" y="0" width="24" height="24" fill="white"/>
          <circle class="icon-mask-dot" cx="12" cy="12" r="7" fill="black"/>
        </mask>
        <circle cx="12" cy="12" r="7" fill="currentColor" mask="url(#moon-mask)"/>
        <g class="icon-rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </g>
      </svg>
    </button>
  </div>

  <!-- chat messages -->
  <div id="chat-area">
    <div id="empty-state">
      <h2>What do you want to study?</h2>
      <p>Upload a PDF or ask a question from your indexed documents.</p>
    </div>
  </div>

  <!-- bottom input bar -->
  <div id="bottom-bar">
    <div id="input-row">
      <button class="bar-btn" onclick="document.getElementById('file-input').click()" title="Upload PDF">📎</button>
      <input type="file" id="file-input" accept=".pdf" onchange="uploadPDF(this)">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Ask a question..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="askQuestion()" title="Send">➤</button>
    </div>
    <div id="upload-toast"></div>
  </div>
</div>

<script>
  // ── theme toggle ──
  function toggleTheme() {
    document.body.classList.toggle('light');
  }

  // ── sidebar ──
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('main').classList.toggle('shifted');
    document.getElementById('overlay').classList.toggle('show');
  }

  // ── auto-resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── send on Enter (Shift+Enter = newline) ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      askQuestion();
    }
  }

  // ── history store ──
  const history = [];

  function addToHistory(question) {
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    history.push({ question, time });
    renderHistory();
  }

  function renderHistory() {
    const el = document.getElementById('history-list');
    if (history.length === 0) {
      el.innerHTML = '<div class="sidebar-empty">No questions yet</div>';
      return;
    }
    el.innerHTML = history.map((h, i) =>
      `<div class="history-item" onclick="scrollToMessage(${i})">
        <span class="q-text">${h.question}</span>
        <span class="q-time">${h.time}</span>
      </div>`
    ).join('');
  }

  function scrollToMessage(index) {
    const messages = document.querySelectorAll('.message-wrap');
    if (messages[index * 2]) {
      messages[index * 2].scrollIntoView({ behavior: 'smooth' });
    }
  }

  function renderSources(sources) {
    const el = document.getElementById('source-list');
    if (!sources || sources.length === 0) {
      el.innerHTML = '<div class="sidebar-empty">No sources found</div>';
      return;
    }
    el.innerHTML = sources.map(s =>
      `<div class="source-item">${s.replace('docs/', '')}</div>`
    ).join('');
  }

  // ── upload PDF ──
  async function uploadPDF(input) {
    const file = input.files[0];
    if (!file) return;

    const toast = document.getElementById('upload-toast');
    toast.textContent = `Uploading ${file.name}... (this may take a few minutes)`;

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      toast.textContent = '✓ ' + data.message;
      setTimeout(() => toast.textContent = '', 4000);
    } catch (e) {
      toast.textContent = '✗ Upload failed. Try again.';
    }

    input.value = '';
  }

  // ── ask question ──
  async function askQuestion() {
    const input = document.getElementById('question-input');
    const question = input.value.trim();
    if (!question) return;

    // hide empty state
    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.remove();

    // add user bubble
    appendMessage('user', question);
    addToHistory(question);

    input.value = '';
    input.style.height = 'auto';

    // add thinking indicator
    const thinkingId = appendThinking();

    document.getElementById('send-btn').disabled = true;

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();

      removeThinking(thinkingId);
      appendMessage('assistant', data.answer, data.sources);
      renderSources(data.sources);

    } catch (e) {
      removeThinking(thinkingId);
      appendMessage('assistant', 'Something went wrong. Please try again.');
    }

    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  // ── chat rendering ──
  function appendMessage(role, text, sources = []) {
    const chatArea = document.getElementById('chat-area');
    const wrap = document.createElement('div');
    wrap.className = 'message-wrap';

    if (role === 'user') {
      wrap.innerHTML = `<div class="user-msg">${escapeHtml(text)}</div>`;
    } else {
      const rendered = marked.parse(text);
      const sourceTags = sources.length > 0
        ? `<div class="sources-line">${sources.map(s =>
            `<span class="source-tag">📄 ${s.replace('docs/','')}</span>`
          ).join('')}</div>`
        : '';
      wrap.innerHTML = `
        <div class="assistant-wrap">
          <div class="assistant-label">Assistant</div>
          <div class="assistant-msg">${rendered}${sourceTags}</div>
        </div>`;
    }

    chatArea.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function appendThinking() {
    const chatArea = document.getElementById('chat-area');
    const wrap = document.createElement('div');
    wrap.className = 'message-wrap';
    const id = 'thinking-' + Date.now();
    wrap.id = id;
    wrap.innerHTML = `
      <div class="assistant-wrap">
        <div class="assistant-label">Assistant</div>
        <div class="assistant-msg">
          <div class="thinking"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    chatArea.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return id;
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
